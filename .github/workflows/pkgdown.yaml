# The pkgdown site (issue #49, the resolution of issue #19).
#
# `build` runs on every push and pull request, so a change that breaks the
# site shows while the repository is private. It also checks that the
# tarball ships exactly one image, man/figures/logo.png, and none of the
# site configuration or logo sources.
#
# `deploy` publishes the site built from main to GitHub Pages, with the
# Pages source "GitHub Actions". It is skipped while the repository is
# private (the free plan has no Pages for private repositories, issue #48)
# and starts publishing, unchanged, once the repository is public and Pages
# is enabled.

name: pkgdown

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run, except
# on main, where a run that may be deploying is left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # The destination is site/ (set in _pkgdown.yml): docs/ holds the ADRs.
      - name: Build the site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Build the tarball and check what it ships
        run: |
          R CMD build --no-build-vignettes .
          Rscript .github/scripts/tarball-contents.R

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    if: >-
      github.event.repository.private == false
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deployment in progress is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
